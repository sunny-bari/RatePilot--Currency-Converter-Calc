{% extends "base.html" %}{% block title %}Compare — RatePilot{% endblock %}{% block content %}<section class="page wrap"><div class="page-title"><p class="eyebrow">COMPARE / 07</p><h1>Put currencies in the same frame.</h1><p>Compare each selected currency against a common base.</p></div><div class="compare-tools"><label>BASE<select id="compareBase">{% for c,n in currencies.items() %}<option value="{{c}}" {% if c=='USD' %}selected{% endif %}>{{c}} · {{n}}</option>{% endfor %}</select></label><div id="comparePicks">{% for c in ['EUR','GBP','INR','JPY'] %}<label class="check"><input type="checkbox" value="{{c}}" checked> {{c}}</label>{% endfor %}</div><button id="runCompare" class="primary">Compare →</button></div><div id="compareGrid" class="compare-grid"></div></section>{% endblock %}
